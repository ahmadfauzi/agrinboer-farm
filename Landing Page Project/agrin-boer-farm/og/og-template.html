<!doctype html>
<!-- Sumber gambar preview (og-image). Render 1200×630; ?tema=putih untuk versi latar putih. Tidak ikut tayang. -->
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../site/tokens.css">
<script>if (new URLSearchParams(location.search).get('tema') === 'putih') document.documentElement.dataset.tema = 'putih';</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--bg); font-family: var(--font-isi); color: var(--teks); position: relative; overflow: hidden; }
  .isi { position: absolute; inset: 0 0 96px 0; display: grid; grid-template-columns: 1fr 380px; gap: 64px; align-items: center; padding: 0 80px; }
  .merek { font-family: var(--font-judul); font-size: 30px; font-weight: 600; color: var(--judul); }
  .merek span { font-family: var(--font-isi); font-size: 24px; font-weight: 500; color: var(--teks-lembut); }
  h1 { margin-top: 28px; font-family: var(--font-judul); font-weight: 600; font-size: 70px; line-height: 1.06; text-wrap: balance; letter-spacing: -0.025em; color: var(--judul); font-variation-settings: "SOFT" 50; }
  .kartu { background: var(--bg-kartu); border-radius: 18px; box-shadow: var(--bayangan-kartu); overflow: hidden; }
  .kepala { background: var(--hijau-kandang); color: var(--krem-jerami); display: flex; justify-content: space-between; align-items: center; padding: 20px 26px; font-family: var(--font-judul); font-size: 28px; font-weight: 600; }
  .kepala svg { width: 54px; height: 54px; color: var(--emas-terang); }
  dl { padding: 10px; display: grid; gap: 6px; }
  dl div { display: grid; grid-template-columns: 130px 1fr; padding: 14px 16px; border-radius: 8px; font-size: 22px; }
  dl div:nth-child(odd) { background: var(--bg-baris); }
  dt { font-weight: 700; color: var(--teks-lembut); font-size: 19px; align-self: center; }
  dd { font-weight: 700; }
  .pita { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: var(--hijau-kandang); color: var(--krem-jerami); display: flex; align-items: center; padding: 0 80px; font-size: 26px; font-weight: 500; }
  .pita svg { position: absolute; top: -1px; left: 0; width: 100%; height: 22px; color: var(--emas-terang); }
</style></head><body>
<div class="isi">
  <div>
    <p class="merek">Agrin Boer Farm <span>· Aqiqah</span></p>
    <h1>Aqiqah tuntas, dari kandang kami sendiri.</h1>
  </div>
  <div class="kartu">
    <div class="kepala">Kartu Kambing
      <svg viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 17c-2-6-7-9-12-8 4 2 6 5 7 10"/><path d="M39 17c2-6 7-9 12-8-4 2-6 5-7 10"/><path d="M22 20c-6 0-12 4-15 11 5 1 10-1 14-5"/><path d="M42 20c6 0 12 4 15 11-5 1-10-1-14-5"/><path d="M22 20c2-3 6-4 10-4s8 1 10 4c1 6 0 13-2 19-2 7-5 13-8 13s-6-6-8-13c-2-6-3-13-2-19Z"/><path d="M28 47c1.5 1.2 6.5 1.2 8 0"/><circle cx="26.5" cy="29" r="1.2" fill="currentColor"/><circle cx="37.5" cy="29" r="1.2" fill="currentColor"/></g></svg>
    </div>
    <dl>
      <div><dt>Jenis</dt><dd>Boer</dd></div>
      <div><dt>Kandang</dt><dd>Tajinan, Malang</dd></div>
      <div><dt>Kunjungan</dt><dd>Dengan janji</dd></div>
    </dl>
  </div>
</div>
<div class="pita">
  <svg viewBox="0 0 1200 22" preserveAspectRatio="none"><path d="M0 11 C 100 2, 200 2, 300 11 S 500 20, 600 11 S 800 2, 900 11 S 1100 20, 1200 11" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
  Peternakan Kambing untuk Keluarga — Malang
</div>
</body></html>
